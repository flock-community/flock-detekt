hexagonal-domain:
  active: true

  DomainNoPrimitiveObsession:
    active: true
    domainPackages: ['domain', 'core']
    allowedPrimitives: []  # None by default

  DomainNoFrameworkImports:
    active: true
    domainPackages: ['domain', 'core']
    forbiddenImports:
      - 'org.springframework'
      - 'io.ktor'
      - 'jakarta'
      - 'javax.servlet'
      - 'io.micronaut'
      - 'io.quarkus'
      - 'org.hibernate'
      - 'org.jooq'

  DomainModelMustBeStandalone:
    active: false  # opt-in; stricter than DomainNoFrameworkImports
    domainPackages: ['domain', 'core']
    allowedPackages:
      - 'kotlin'
      - 'kotlinx'
      - 'java'
      - 'javax.annotation'
      # domainPackages are always implicitly allowed
    additionalAllowedPackages: []  # project-specific allow-list extensions

  DomainMustBeImmutable:
    active: true
    domainPackages: ['domain', 'core']

  ValueClassMustHaveJvmInline:
    active: true
    domainPackages: ['domain', 'core']
    checkOnlyInDomain: false  # Check all value classes by default

  # Opt-in (new in 1.3.0): set `active: true` to enable.
  SmartConstructorMustHaveConsistentCopyVisibility:
    active: false
    domainPackages: ['domain', 'core']

  # Opt-in (new in 1.3.0): set `active: true` to enable.
  IdentifierMustBeValueClass:
    active: false
    domainPackages: ['domain', 'core']
    identifierNamePattern: '^id$|.*Id$'
    rawTypes:
      - 'String'
      - 'Int'
      - 'Long'
      - 'UUID'
      - 'java.util.UUID'
      - 'Uuid'
      - 'kotlin.uuid.Uuid'
      - 'kotlin.String'
      - 'kotlin.Int'
      - 'kotlin.Long'
    checkIdCollections: false  # also check the element type of `*Ids` collections
    idCollectionNamePattern: '^ids$|.*Ids$'
