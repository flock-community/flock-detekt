name: Deploy to Maven Central

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
  OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
  GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
  GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check if snapshot
        id: check-snapshot
        run: |
          VERSION=$(grep -oP 'version = "\K[^"]+' build.gradle.kts | head -1)
          if [[ "$VERSION" == *"-SNAPSHOT"* ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
            echo "Detected SNAPSHOT version: $VERSION"
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
            echo "Detected release version: $VERSION"
          fi

      - name: Publish to Snapshot Repository
        if: steps.check-snapshot.outputs.is_snapshot == 'true'
        run: ./gradlew publishToSonatype

      - name: Publish to Maven Central
        if: steps.check-snapshot.outputs.is_snapshot == 'false'
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
